name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer & Portable
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/DnDAIe5-Setup-*.exe
            dist/DnDAIe5-Portable-*.exe

  publish-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # ⚔️ DnDAIe5 — AI Dungeon Master & Party RPG (${{ github.ref_name }})

            ## 📦 Скачать дистрибутивы игры:
            - **Windows Portable (Портативная версия без установки):** `DnDAIe5-Portable-*.exe`
            - **Windows Setup (Установщик NSIS):** `DnDAIe5-Setup-*.exe`

            > 📱 **Для смартфонов и мобильных устройств**: игра доступна через любой мобильный браузер при подключении к хосту в локальной сети (LAN) или через веб-развертывание.

            ### 🌟 Особенности релиза:
            - 🚀 **DnDAIe5 Portable**: Полная автономность, быстрое извлечение со сплэш-скрином и сохранение прогресса в папку `data` рядом с исполняемым файлом.
            - 📱 **Адаптивный мобильный веб-интерфейс**: Оптимизированный интерфейс для смартфонов и планшетов без необходимости устанавливать отдельное приложение.
            - 🎙️ **Синтез речи (TTS)**: Поддержка Microsoft Edge Neural TTS, потоковых голосов и офлайн Web Speech API.
            - 👥 **LAN Мультиплеер**: Совместная ролевая игра по локальной сети.
          files: |
            dist/*.exe
